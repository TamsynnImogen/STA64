; Paired scene (TOOL-15, docs/TESTBENCH.md "Paired scenes"), SIM-36: the attack approach and targets
; of opportunity. Federation destroyers (fdestroy: impulseSpeed 140, combatSpeed 70, warpSpeed 400, regular
; weapon range 400) right-clicked onto unarmed, immortal enemies straight ahead; lanes 900 apart.
; The rules measured with it (stock A2 and Roots + STA2 Classic, which both set cfg_MIN_MOVE_WARP_DISTANCE
; 1100 in RTS_CFG.h):
; - a (700) and b (1000): no warp. Stock closes at combatSpeed, Roots at impulseSpeed;
; - c (1300) to f (3000): warp once facing the goal at about impulse speed. Stock drops out when the
;   target is about 1100 away (surface to surface) and closes at combatSpeed; Roots stays in warp to
;   about 450-500 from the target;
; - g: a Galaxy (range 600) at 3000: the drop-out point does not move with range, the stop point does;
; - stops (centre to centre): fdestroy 348 stock / 312 Roots, Galaxy 612 / 581;
; - h is ordered onto th past an enemy 250 off its path: stock fires only at th, Roots at both;
; - m moves (goto) past an enemy 250 off its path: it fires at it and keeps its course (both).
; What to read in the report: motion start, top speed and arrival per lane; fire targets of h and m.
; Commands land late on the original (each right-click is one drive round trip), so the orders are
; compared on their landing times.
[Scene]
Fog=0
Hud=1
Grid=0
Cursor=1
Notices=0
Anchor=world
Seed=7

[Marks]
SimTime=1
State=250
Ordnance=1

[Pair]
Games=a2,roots
Duration=75
roots.Duration=90
Tol=time=0.5,pos=40,hull=5
a2.Race=federation
a2.Launch=-nointro a2_borg01
roots.Race=unitedfederation
roots.Size=1280x960
roots.Mod=STA2 Classic Mod
roots.Launch=-nointro -mod "STA2 Classic Mod" fulltech.bzn
At=2 goto m 2500 0 5000
At=3 select a
At=4 rclick ta
At=5 select b
At=6 rclick tb
