; Paired scene (TOOL-15, docs/TESTBENCH.md "Paired scenes"): a player's right-click
; (`rclick`, the bench's pointer on the original) with mixed selections. The originals
; send the highest-priority order any selected unit would take to the whole selection;
; units that cannot carry it out keep what they were doing (sta_sim::context).
; A: freighter + destroyer + construction ship on a dilithium moon -> only the freighter
;    mines, the others stay. B: two destroyers on a moon -> both move there.
; C: freighter + construction ship + destroyer on an enemy -> the destroyer attacks
;    (closing in needs SIM-36's attack approach), the others stay.
; D: freighter + construction ship (unarmed) on an enemy -> both move.
; Measured on stock A2 and Roots + STA2 Classic (positions from the state marks).
[Scene]
Fog=0
Hud=1
Grid=0
Cursor=1
Notices=0
Anchor=world
Seed=7

[Marks]
SimTime=1
State=500
Ordnance=1

[Pair]
Games=a2,roots
Duration=48
Tol=time=0.5,pos=200,hull=5
a2.Race=federation
a2.Launch=-nointro a2_borg01
roots.Race=unitedfederation
roots.Size=1280x960
roots.Mod=STA2 Classic Mod
roots.Launch=-nointro -mod "STA2 Classic Mod" fulltech.bzn
At=4 select m1 w1 c1
At=6 rclick moonA
At=12 select w2 w3
At=14 rclick moonB
At=20 select m3 c3 w4
At=22 rclick e4
At=28 select m5 c5
At=30 rclick e5

