; Paired scene (TOOL-15, docs/TESTBENCH.md "Paired scenes"), SIM-53: when the first shot leaves.
; Galaxy-class ships (phaser shotDelay 2.0, photon 1.4, range 600) and Borg cubes 300-530 away,
; each group 2500 from the next. The rules measured with it (stock A2, Roots + STA2 Classic):
; - nobody fires before 2.0 s of mission time (`start_fire_hold`); the scene is built 0.76-0.86 s
;   (stock) or 1.3-1.9 s (Roots) into the mission (`ready`), so on stock a, b and d fire first at
;   about ready+1.15..1.25 s, never earlier (on Roots the hold is mostly over at the build);
; - after that a weapon fires when its initial reload U[0,1) x shotDelay from creation ends (a, b);
;   which draw each weapon gets is random on both sides, so single first-shot times differ;
; - c's weapons come on at 4 s, long ready: both fire at once, no order latency;
; - d, firing at d1, is right-clicked onto d2 and back: the switch lands on each weapon's next
;   natural shot, the timers are not reset;
; - g is spawned at 9 s: it fires within its initial reload, no hold.
; What to read in the report: c's two shots (equal within a tick), the earliest shot of a, b and
; d (the hold, on the same tick on both sides), d's switch on its next shot, g within shotDelay.
; Each other first shot is a random draw on both engines, so those rows are beyond tolerance by
; design. Roots' sim runs faster than the wall clock and its commands land late: Duration 28.
