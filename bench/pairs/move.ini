; Paired scene (TOOL-15, docs/TESTBENCH.md "Paired scenes"): behaviour measurement.
; A Galaxy class at rest is ordered 1200 units ahead (+z) one second after the scene is
; built; the `state` trace (position, hull, shields every 250 ms of sim time) of both
; engines is compared on one sim-seconds axis: start, acceleration, cruise, braking.
; A second, unarmed destroyer turns 90 degrees onto its course (+x).
