; 3peace: class M), because the bench's stage is empty: the original draws no map-placed planet there,
; STA64 draws the map's, so the same place lines the two up. A Galaxy class stays out of frame for the
; marks. Planet radius: 207 (class L, ScaleSOD 1) and 261 (class M).
