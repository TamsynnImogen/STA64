name: Android APK (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK components
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - name: Install Rust target and cargo-ndk
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 aarch64-linux-android
          renice -n 19 -p $$ >/dev/null
          cargo install cargo-ndk --version 4.1.2 --locked --jobs 2
      - name: Build and verify debug APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          tools/android/build.sh debug
      - uses: actions/upload-artifact@v4
        with:
          name: sta64-android-arm64-debug
          path: packaging/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
