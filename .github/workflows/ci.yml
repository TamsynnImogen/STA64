name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core crates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: cargo test --workspace --exclude sta64
      - run: cargo clippy --workspace --exclude sta64 --all-targets -- -D warnings

  game:
    name: sta64 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p sta64 --release
      - run: cargo clippy -p sta64 -- -D warnings
      - name: Bench smoke (sim-only)
        run: cargo run -p sta64 --release -- --sim-only --scene bench/scenes/synthetic.ini --ticks 300
      - run: cargo test -p sta64 --release
