name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore: ['docs/**']
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Full 4-OS matrix on main and on PRs labelled `full-ci`; Linux only otherwise.
  core:
    name: core crates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["ubuntu-latest","ubuntu-24.04-arm","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude sta64
      - run: cargo clippy --workspace --exclude sta64 --all-targets -- -D warnings
      # TOOL-06: the bench report, with its per-tick digests, so a platform that
      # drifts can be compared with `sta-bench diff`. `cargo test` above already
      # ran every tier-1 scenario, including the `golden-*` ones that pin a
      # digest; this reuses the build and keeps the report (never frames).
      - name: sta-bench check (report)
        if: success() || failure()
        run: cargo run -p sta_bench --bin sta-bench -- check --out bench-report
      - name: Upload bench report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report-${{ matrix.os }}
          path: |
            bench-report/**/report.md
            bench-report/**/results.json
            bench-report/**/digests
            !bench-report/latest/**
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  game:
    name: sta64 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["ubuntu-latest","ubuntu-24.04-arm","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build (main)
        if: github.event_name != 'pull_request'
        run: cargo build -p sta64 --release
      - name: Check (PR)
        if: github.event_name == 'pull_request'
        run: cargo check -p sta64 --all-targets
      - run: cargo clippy -p sta64 -- -D warnings
      - name: Bench smoke (sim-only)
        run: cargo run -p sta64 --release -- --sim-only --scene bench/scenes/synthetic.ini --ticks 300
      - run: cargo test -p sta64 --release
