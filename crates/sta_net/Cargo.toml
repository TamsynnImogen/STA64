[package]
name = "sta_net"
description = "STA64 multiplayer: lockstep protocol, router and relay"
version.workspace = true
edition.workspace = true
license.workspace = true

# Bevy-free; sits above sta_sim (docs/WORKPLAN.md, "Seams"). The wire format
# is postcard behind a fixed little-endian frame header (docs/NET.md).
[dependencies]
sta_core = { workspace = true, features = ["serde"] }
sta_content.workspace = true
sta_sim.workspace = true
serde.workspace = true
postcard.workspace = true
# Room codes (the relay) from OS randomness; already in the lock file for
# sta_vfs.
getrandom.workspace = true
