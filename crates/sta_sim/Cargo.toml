[package]
name = "sta_sim"
description = "Deterministic, renderer-independent STA64 game simulation"
version.workspace = true
edition.workspace = true
license.workspace = true

# Deliberately no Bevy dependency: the simulation must run headless, in tests,
# on dedicated servers, and stay bit-identical across platforms for lockstep.
[dependencies]
sta_core = { workspace = true, features = ["serde"] }
# Typed content only: the sim reads no raw ODF or file (MODDING_DECISIONS D9),
# so neither `sta_odf` nor `sta_vfs` is a dependency (install-gated tests
# mount installs through `sta_vfs` as a dev-dependency).
sta_content.workspace = true
serde.workspace = true
# The fakes: ScriptedSource reads JSON5 timelines, ViewLog writes postcard.
json5.workspace = true
postcard.workspace = true

[dev-dependencies]
sta_vfs.workspace = true
