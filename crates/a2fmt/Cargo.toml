[package]
name = "a2fmt"
version = "0.1.0"
edition = "2024"
publish = false
description = "Readers for Star Trek: Armada II's asset formats (SOD, TGA, .spr, ODF), no_std"
license = "MIT"
# Vendored from Armada II Refit (https://github.com/cedrichaase/armada2-refit),
