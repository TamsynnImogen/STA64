# LICENSE). Local changes: workspace membership; stock test reads only A2_GAME;
# colour-mapped TGA decoding. See VENDORED.md.

[lib]
name = "a2fmt"
path = "src/lib.rs"

[dependencies]
libm = "0.2"

# Vendored code: keep it close to upstream rather than restyling for clippy.
[lints.clippy]
all = { level = "allow", priority = -1 }
