[package]
name = "sta_tools"
description = "Modder tools: shared command-line plumbing and the odf_fmt formatter (EDT-01, EDT-06)"
version.workspace = true
edition.workspace = true
license.workspace = true

# Light by default: no Bevy, no egui. The windowed tool shell of EDT-01 is
# behind the `shell` feature (bin `tool_shell`), so the command-line tools
# stay quick to build.

[features]
shell = ["dep:bevy", "dep:bevy_egui", "dep:sta_vfs", "dep:sta_content", "dep:sta_assets", "dep:thiserror"]

[dependencies]
sta_odf.workspace = true
sta_vfs = { workspace = true, optional = true }
sta_content = { workspace = true, optional = true }
sta_assets = { workspace = true, optional = true }
bevy = { workspace = true, optional = true }
bevy_egui = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[[bin]]
name = "tool_shell"
required-features = ["shell"]

[dev-dependencies]
sta_vfs.workspace = true
