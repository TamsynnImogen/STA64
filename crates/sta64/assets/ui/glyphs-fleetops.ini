; The codes Fleet Operations: Roots' fonts draw as pictures or figures of their own, with the
; word or figure to write where a font cannot draw them (UI-16). The same `[Glyphs]` table
; Refit's `ui/content/sets/fleetops/ui.ini` carries (first-party; code in hex = text). A mod
; overrides it with a `[Glyphs]` section in its own `ui.ini`. Words only: no art is copied.
[Glyphs]
; The cost lines set their icons apart with "$", a spacer in the larger screens' fonts.
24 = " "
; The red figures.
7F = 0
81 = 1
8D = 2
8F = 3
90 = 4
9D = 5
A0 = 6
AD = 7
BE = 8
D7 = 9
BB = +
BC = -
BD = .
; The resource icons (0x80 is the clock after a build cost's crew: seconds).
80 = s
85 = Dilithium
86 = Tritanium
87 = Supply
89 = Crew
8C = Biomatter
99 = Connection Nodes
; The unit classes.
A1 = Support Vessel
A2 = Cruiser
A3 = Battleship
A4 = Scout
A5 = Dreadnought
A8 = Berserker
A9 = Artillery
AA = Construction Ship
AE = Mining Ship
D8 = Destroyer
F8 = Station
