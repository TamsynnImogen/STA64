[package]
name = "sta64"
description = "STA64 — native 64-bit Star Trek Armada II / Fleet Operations engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bevy = { workspace = true, features = ["dds", "png", "jpeg"] }
sta_vfs.workspace = true
sta_assets.workspace = true
sta_bzn.workspace = true
sta_mission.workspace = true
sta_surface.workspace = true
sta_odf.workspace = true
sta_sim.workspace = true
sta_net.workspace = true
sta_content.workspace = true
sta_core.workspace = true
sta_ai.workspace = true
sta_bench.workspace = true
sta_media.workspace = true
image.workspace = true
kira = { version = "=0.12.6", default-features = false, features = ["cpal"] }

[features]
# Faster incremental linking during development: `cargo run --features dev`.
dev = ["bevy/dynamic_linking"]
# Per-system CPU times for `--perf-systems` (docs/TESTBENCH.md, "Performance runs"): Bevy's tracing spans.
perf-trace = ["bevy/trace", "bevy/debug"]

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
png = "0.18"

# The Android activity glue is enabled only for the native Android target.
[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = ["android-native-activity"] }
