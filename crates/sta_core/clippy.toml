# Determinism rules (docs/WORKPLAN.md, "Determinism rules"): no hash-order
# iteration, no platform maths, no clocks in simulation code. The same list is
# in crates/sta_sim/clippy.toml; keep them equal.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is not deterministic; use BTreeMap or a sorted Vec" },
    { path = "std::collections::HashSet", reason = "iteration order is not deterministic; use BTreeSet or a sorted Vec" },
]
disallowed-methods = [
    { path = "f32::sin", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::cos", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::tan", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::sin_cos", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::asin", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::acos", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::atan", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::atan2", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::sinh", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::cosh", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::tanh", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::sqrt", reason = "use Fixed::sqrt, which is exact everywhere" },
    { path = "f32::cbrt", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::hypot", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::powf", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::powi", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::exp", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::exp2", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::exp_m1", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::ln", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::ln_1p", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::log", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::log2", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::log10", reason = "platform maths differ between targets; use Fixed" },
    { path = "f32::mul_add", reason = "fused or not depends on the target; use Fixed" },
    { path = "f64::sin", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::cos", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::tan", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::sin_cos", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::asin", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::acos", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::atan", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::atan2", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::sinh", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::cosh", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::tanh", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::sqrt", reason = "use Fixed::sqrt, which is exact everywhere" },
    { path = "f64::cbrt", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::hypot", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::powf", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::powi", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::exp", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::exp2", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::exp_m1", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::ln", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::ln_1p", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::log", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::log2", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::log10", reason = "platform maths differ between targets; use Fixed" },
    { path = "f64::mul_add", reason = "fused or not depends on the target; use Fixed" },
    { path = "std::time::Instant::now", reason = "no clocks in the simulation; time is the tick count" },
    { path = "std::time::SystemTime::now", reason = "no clocks in the simulation; time is the tick count" },
]
