[package]
name = "sta_bench"
description = "STA64 test bench: scene, command and scenario parsers and the tier-1 in-process runner (Bevy-free)"
version.workspace = true
edition.workspace = true
license.workspace = true

# Deliberately no Bevy dependency: the bench runs in `cargo test` with no GPU.
[dependencies]
thiserror.workspace = true
sta_core.workspace = true
sta_content.workspace = true
sta_sim.workspace = true
sta_vfs.workspace = true
# Desync diagnosis (NET-06): `sta-bench desync` calls `sta_net::diagnose` (Bevy-free).
sta_net.workspace = true
# Paired scenes on install content (TOOL-17): the pair's map is read from the install.
sta_bzn.workspace = true
serde.workspace = true
json5.workspace = true
# The capture index is written as strict JSON (`jq` reads it); read with json5 so the older JSON5 form still loads.
serde_json.workspace = true
# Paired scenes (TOOL-15): frames read and written as PNG.
png = "0.18"

[[bin]]
name = "sta-bench"
path = "src/bin/sta-bench.rs"

[dev-dependencies]
