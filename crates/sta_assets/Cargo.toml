[package]
name = "sta_assets"
description = "Asset lookup and decoding (SOD, TGA, DDS, glTF, KTX2) over the STA64 VFS"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
a2fmt.workspace = true
ddsfile = "0.6"
# Sound decoding, pure Rust (CON-10): Ogg Vorbis (MIT OR Apache-2.0) and MPEG audio
# (MIT OR Apache-2.0, a safe port of minimp3). WAV is parsed in audio.rs.
lewton = "0.10"
nanomp3 = { version = "0.2", default-features = false, features = ["std"] }
sta_vfs.workspace = true
thiserror.workspace = true
gltf.workspace = true
base64.workspace = true
sha2.workspace = true

[dev-dependencies]
sta_bzn.workspace = true
sta_odf.workspace = true

[[example]]
name = "model_textures"
test = true
