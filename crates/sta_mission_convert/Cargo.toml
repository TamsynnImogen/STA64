[package]
name = "sta_mission_convert"
description = "Converts the player's own legacy mission DLLs (Armada I and II) to Lua on their machine (LUA-15; reads bytes only, D2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# x86 decoder and Intel-syntax formatter (MIT, pure Rust, no C): the DLLs are only ever read as bytes.
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "intel"] }
regex = "1"
sha2.workspace = true
thiserror.workspace = true
serde_json.workspace = true
