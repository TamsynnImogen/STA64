[workspace]
resolver = "3"
members = ["crates/a2fmt", "crates/sta_vfs", "crates/sta_fpq", "crates/sta_odf", "crates/sta_assets", "crates/sta_sim", "crates/sta64"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TamsynnImogen/STA64"

[workspace.dependencies]
a2fmt = { path = "crates/a2fmt" }
sta_vfs = { path = "crates/sta_vfs" }
sta_fpq = { path = "crates/sta_fpq" }
sta_odf = { path = "crates/sta_odf" }
sta_assets = { path = "crates/sta_assets" }
sta_sim = { path = "crates/sta_sim" }
bevy = "0.20.1"
thiserror = "2"

# Bevy is slow unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
