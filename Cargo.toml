[workspace]
resolver = "3"
members = [
    "crates/a2fmt",
    "crates/sta_vfs",
    "crates/sta_fpq",
    "crates/sta_odf",
    "crates/sta_assets",
    "crates/sta_bzn",
    "crates/sta_mission",
    "crates/sta_surface",
    "crates/sta_core",
    "crates/sta_content",
    "crates/sta_sim",
    "crates/sta_bench",
    "crates/sta_net",
    "crates/sta_ai",
    "crates/sta_fontbake",
    "crates/sta_media",
    "crates/sta_tools",
    "crates/sta64",
]
# `cargo run` (and bare `cargo build`/`cargo test`) target the game; use
# `-p <crate>` or `--workspace` for the others.
default-members = ["crates/sta64"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TamsynnImogen/STA64"

[workspace.dependencies]
a2fmt = { path = "crates/a2fmt" }
sta_vfs = { path = "crates/sta_vfs" }
sta_fpq = { path = "crates/sta_fpq" }
sta_odf = { path = "crates/sta_odf" }
sta_assets = { path = "crates/sta_assets" }
sta_bzn = { path = "crates/sta_bzn" }
sta_mission = { path = "crates/sta_mission" }
sta_surface = { path = "crates/sta_surface" }
sta_sim = { path = "crates/sta_sim" }
sta_core = { path = "crates/sta_core" }
sta_content = { path = "crates/sta_content" }
sta_bench = { path = "crates/sta_bench" }
sta_net = { path = "crates/sta_net" }
sta_ai = { path = "crates/sta_ai" }
sta_fontbake = { path = "crates/sta_fontbake" }
sta_media = { path = "crates/sta_media" }
sta_tools = { path = "crates/sta_tools" }
# No `audio` feature (bevy_audio -> rodio): sound is `kira` (crates/sta64/src/audio), and a second
# rodio output stream next to it is unused and flooded the log on a device error.
bevy = { version = "0.20.1", default-features = false, features = ["2d", "3d", "ui"] }
thiserror = "2"
# Snapshots, replays and the wire (postcard); native content and fakes (json5).
serde = { version = "1", features = ["derive", "rc"] }
json5 = "1"
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
# FPQ packing: LZO1X compression (MIT; liblzo itself is GPL).
lzokay-native = "0.2.1"
# .sta archives: Zstandard (pure Rust, MIT) and SHA-256 (MIT OR Apache-2.0).
ruzstd = "0.9.1"
sha2 = "0.11.1"
# .sta signatures: Ed25519 (BSD-3-Clause) and OS randomness for new keys.
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
# Mod manifests (manifest.toml) and their version requirements.
toml = "1.2.1"
semver = "1.0.28"
# Native glTF parsing and image decoding; versions already occur in Bevy's lock graph.
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "KHR_materials_unlit"] }
base64 = "=0.23.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

# Bevy is slow unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# The surface bake is heavy number crunching: optimise it even in dev builds.
[profile.dev.package.sta_surface]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
